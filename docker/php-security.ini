; Apply in Docker only. XAMPP keeps its own php.ini.
expose_php = Off
display_errors = Off
log_errors = On
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
; Keep HTTP-compatible cookies for localhost-only demo access.
; Set cookie_secure=1 when using HTTPS, and test login after that change.
