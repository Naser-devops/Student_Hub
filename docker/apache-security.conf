# Applied by Dockerfile at server-config level (independent of .htaccess).
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory "/var/www/html">
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted
</Directory>

# Never deliver private PHP, SQL, or configuration directories to browsers.
<Directory "/var/www/html/config">
    Require all denied
</Directory>
<Directory "/var/www/html/database">
    Require all denied
</Directory>
<Directory "/var/www/html/includes">
    Require all denied
</Directory>
<Directory "/var/www/html/docker">
    Require all denied
</Directory>

# Installer is CLI-only in Docker. Do not expose it even on fresh containers.
<Files "setup.php">
    Require all denied
</Files>

<FilesMatch "(?i)^(?:\..*|Dockerfile|docker-compose(?:\..*)?|README(?:\..*)?|start\.(?:sh|bat)|.*\.(?:sql|md|log|bak|backup|ini|ya?ml|conf|key|pem))$">
    Require all denied
</FilesMatch>

# Static assets should never execute uploaded PHP.
<Directory "/var/www/html/assets">
    <FilesMatch "(?i)\.p(?:hp[0-9]?|html)$">
        Require all denied
    </FilesMatch>
</Directory>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
</IfModule>
